<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Personal Lab — Build. Break. Fix.</title>
  <desc id="desc">Banner animado negro y granate. A la derecha, un programa Python que expresa aprender de los errores y seguir mejorando.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070708"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <rect y="0" width="8" height="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono {font-family:'JetBrains Mono','Courier New',monospace;}
      .bold {font-family:Arial,Helvetica,sans-serif;font-weight:900;}
      .small-fade {animation:flicker 4s infinite ease-in-out;}
      .lineMove {animation:lineMove 6s linear infinite;}
      .word1 {animation:glowWord 4.5s infinite;}
      .word2 {animation:glowWord 4.5s infinite 1.2s;}
      .word3 {animation:glowWord 4.5s infinite 2.4s;}
      .progress {animation:progressBar 5s infinite ease-in-out;}
      .dotBlink {animation:dotBlink 1.4s infinite;}
      @keyframes glowWord {0%,100%{fill:#F2F2F2;opacity:0.72;}50%{fill:#C21E3A;opacity:1;}}
      @keyframes lineMove {0%{transform:translateY(-20px);opacity:0;}10%{opacity:0.7;}50%{opacity:0.45;}100%{transform:translateY(320px);opacity:0;}}
      @keyframes progressBar {0%{width:0;}70%{width:460px;}100%{width:460px;}}
      @keyframes dotBlink {0%,100%{opacity:1;}50%{opacity:0.25;}}
      @keyframes flicker {0%,100%{opacity:0.95;}50%{opacity:0.75;}}
      @keyframes codeFocus {0%,100%{opacity:.35;}50%{opacity:.9;}}
      .codeFocus {animation:codeFocus 4s infinite ease-in-out;}
      @media(prefers-reduced-motion:reduce){.small-fade,.lineMove,.word1,.word2,.word3,.progress,.dotBlink,.codeFocus{animation:none;}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="18" fill="url(#scanlines)" opacity="0.45"/>
  <rect x="10" y="10" width="1180" height="300" rx="14" stroke="#2E2E34" stroke-width="1.5"/>
  <text x="45" y="48" class="mono small-fade" font-size="18" fill="#C21E3A" letter-spacing="2">SYSTEM / PERSONAL LAB</text>
  <line x1="45" y1="64" x2="1155" y2="64" stroke="#2D1A1F" stroke-width="1"/>
  <text x="60" y="125" class="bold word1" font-size="54" fill="#F2F2F2">BUILD.</text>
  <text x="60" y="180" class="bold word2" font-size="54" fill="#F2F2F2">BREAK.</text>
  <text x="60" y="235" class="bold word3" font-size="54" fill="#F2F2F2">FIX.</text>
  <text x="62" y="270" class="mono" font-size="17" fill="#9A9AA2" letter-spacing="1.5">SYSTEMS / NETWORKS / CYBERSECURITY</text>
  <!-- Replacement for 23: a real, small Python program. -->
  <g class="mono">
    <rect x="608" y="83" width="547" height="187" rx="7" fill="#100c10" fill-opacity=".85" stroke="#49232e"/>
    <rect x="609" y="84" width="545" height="28" rx="6" fill="#20151b"/>
    <circle cx="624" cy="98" r="3.5" fill="#A61B34"/><circle cx="637" cy="98" r="3.5" fill="#60313c"/><circle cx="650" cy="98" r="3.5" fill="#43272e"/>
    <text x="667" y="103" font-size="13" fill="#BDA5AD">mindset.py</text>
    <text x="1135" y="103" font-size="11" fill="#B87889" text-anchor="end" letter-spacing="1">PYTHON</text>
    <path d="M608 112H1155" stroke="#40212a"/>
    <rect x="654" y="177" width="490" height="23" rx="3" fill="#5A0E1A" fill-opacity=".28" class="codeFocus"/>
    <path d="M663 159V247 M681 181V224" stroke="#43232c" stroke-width="1"/>
    <g font-size="16" xml:space="preserve">
      <g fill="#80606b" text-anchor="end" font-size="13"><text x="641" y="134">01</text><text x="641" y="157">02</text><text x="641" y="180">03</text><text x="641" y="203">04</text><text x="641" y="226">05</text><text x="641" y="249">06</text></g>
      <text x="655" y="134" fill="#C0A0AA"># Progress, not perfection.</text>
      <text x="655" y="157" fill="#C97B8D">for <tspan fill="#D8C6CD">step</tspan> in <tspan fill="#D8C6CD">("build", "break", "fix"):</tspan></text>
      <text x="693" y="180" fill="#D8C6CD">print(<tspan fill="#C97B8D">step</tspan>)</text>
      <text x="693" y="203" fill="#D8C6CD"># Learn from every mistake.</text>
      <text x="655" y="226" fill="#D8C6CD">print(<tspan fill="#BD7182">"Never stop learning."</tspan>)</text>
      <text x="655" y="249" fill="#C0A0AA"># No shortcuts.</text>
      <rect x="815" y="237" width="8" height="13" rx="1" fill="#A61B34" class="dotBlink"/>
    </g>
  </g>
  <rect x="60" y="288" width="460" height="4" rx="2" fill="#2A2A31"/>
  <rect x="60" y="288" width="460" height="4" rx="2" fill="#7A1224" class="progress"/>
  <text x="60" y="306" class="mono" font-size="15" fill="#E6E6E8">ASIR STUDENT</text>
  <circle cx="510" cy="301" r="5" fill="#A61B34" class="dotBlink"/>
  <text x="525" y="306" class="mono" font-size="15" fill="#C9C9CF">LEARNING IN PROGRESS</text>
  <text x="955" y="306" class="mono" font-size="15" fill="#E6E6E8">NO SHORTCUTS</text>
  <g clip-path="url(#frame)"><rect x="18" y="0" width="1164" height="2" fill="#A61B34" opacity="0.55" class="lineMove"/></g>
</svg>
