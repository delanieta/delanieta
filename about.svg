<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-labelledby="title desc"><title id="title">01. Sobre mí</title><desc id="desc">Estudiante de Administración de Sistemas Informáticos en Red. Me interesan la informática, los sistemas, las redes y la ciberseguridad. Comparto mis proyectos, prácticas y aprendizaje.</desc><defs><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101013"/><stop offset="1" stop-color="#151116"/></linearGradient><style>.signal{animation:signal 3.5s ease-in-out infinite}@keyframes signal{0%,100%{opacity:1}50%{opacity:.48}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}</style></defs><rect x="10" y="5" width="1180" height="245" rx="13" fill="url(#panel)" stroke="#383039" stroke-width="1.5"/><rect x="31" y="24" width="5" height="32" rx="2" fill="#7a1224" stroke="none" stroke-width="1.5"/><text x="49" y="49" font-family="'Liberation Mono',Consolas,monospace" font-size="27" fill="#bd7182" font-weight="700" text-anchor="start" letter-spacing="0">01 /</text><text x="125" y="49" font-family="'Liberation Mono',Consolas,monospace" font-size="27" fill="#e6e6e8" font-weight="700" text-anchor="start" letter-spacing="0">Sobre mí</text><text x="1160" y="47" font-family="'Liberation Mono',Consolas,monospace" font-size="15" fill="#bd7182" font-weight="400" text-anchor="end" letter-spacing="1.2">PROFILE.TXT</text><path d="M32 70 H1168" stroke="#39252e"/><text x="48" y="112" font-family="'Liberation Mono',Consolas,monospace" font-size="25" fill="#e6e6e8" font-weight="700" text-anchor="start" letter-spacing="0">¡Hola! Soy estudiante de ASIR.</text><text x="48" y="150" font-family="'Liberation Mono',Consolas,monospace" font-size="23" fill="#e6e6e8" font-weight="400" text-anchor="start" letter-spacing="0">Administración de Sistemas Informáticos en Red.</text><text x="48" y="193" font-family="'Liberation Mono',Consolas,monospace" font-size="23" fill="#b1a9b1" font-weight="